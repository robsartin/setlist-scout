name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14.3 can't launch on JDK 25 (see build.gradle.kts / ADR-0015), so both JDKs
      # are installed: 21 to run the Gradle process itself, 25 as the toolchain Gradle forks
      # to compile and run tests on. setup-java exposes every installed JDK via a
      # JAVA_HOME_<major>_X64 env var, which the explicit JAVA_HOME below picks up.
      - name: Set up JDK 21 + 25 toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compiles and runs the test suite. Coverage-threshold enforcement
      # (line > 80% / branch > 65%, per the ci-is-the-merge-gate ADR) is added
      # once a test suite exists -- see issue #5.
      - name: Build
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew --no-daemon build

  adr-compliance:
    name: ADR compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Numbering contiguous, no unresolved template tokens, index up to date.
      - name: Check ADRs
        run: python3 scripts/check_adrs.py

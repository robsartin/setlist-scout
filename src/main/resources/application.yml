spring:
  application:
    name: setlist-scout

  # Faster startup on Render's throttled free-tier CPU (the boot was exceeding Render's
  # port-detection window). Lazy-init defers most bean creation so Tomcat binds its port
  # quickly; the scan/expand pollers (scan.ScanPoller / expansion.ExpandPoller) still register
  # on schedule because Spring's TaskSchedulingAutoConfiguration excludes @Scheduled beans from
  # lazy-init automatically -- no @Lazy(false) needed.
  main:
    lazy-initialization: true
  jmx:
    enabled: false

  datasource:
    # Either set DATABASE_URL (a full jdbc:postgresql:// URL) directly, or let it be
    # composed from DB_HOST/DB_PORT/DB_NAME -- the render.yaml blueprint wires those
    # three from the managed database automatically, so nothing has to be hand-formatted.
    # Local dev falls back to localhost with no env vars set.
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:setlistscout}}
    username: ${DATABASE_USERNAME:setlistscout}
    password: ${DATABASE_PASSWORD:setlistscout}

  # Flyway owns the schema (see ADR-0009). baseline-on-migrate adopts an existing,
  # already-populated database (marks its schema as the baseline) as well as creating a
  # fresh one; baseline-version 0 means the V1 baseline migration still runs on empty DBs.
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    open-in-view: false # No lazy associations traversed during view rendering; avoids the open-session-in-view warning
    hibernate:
      ddl-auto: validate # Flyway manages the schema; Hibernate only validates it matches the entities

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile

server:
  port: ${PORT:8080} # Render sets PORT at runtime

setlistscout:
  # Phase B PR4a/PR4b paced claim-lease pollers (scan.ScanPoller / expansion.ExpandPoller) are the
  # driver now -- the old whole-fleet ShowScanScheduler batch has been deleted. See PollerProperties
  # for the full rationale.
  scan-poller-enabled: ${SCAN_POLLER_ENABLED:true}
  expand-poller-enabled: ${EXPAND_POLLER_ENABLED:true}
  scan-tick-ms: ${SCAN_TICK_MS:90000} # also used as this poller's initial delay -- see ScanPoller
  expand-tick-ms: ${EXPAND_TICK_MS:90000}
  scan-batch-size: ${SCAN_BATCH_SIZE:20}
  expand-batch-size: ${EXPAND_BATCH_SIZE:20}
  job-lease-ms: ${JOB_LEASE_MS:300000} # 5m -- how long a claimed-but-not-completed job stays claimed before another poller can re-claim it
  scan-interval: ${SCAN_JOB_INTERVAL:14d}
  expansion-interval: ${EXPANSION_JOB_INTERVAL:28d}
  poller-park-cap: ${POLLER_PARK_CAP:6} # attempts at which a failing job stops climbing the backoff ladder and gets pushed a full interval out instead
  # Per-source cadence override, e.g. source-intervals.ticketmaster: 3d -- falls back to
  # scan-interval / expansion-interval above when a source has no entry. Empty by default.
  source-intervals: {}
  job-backfill-enabled: ${JOB_BACKFILL_ENABLED:true} # startup reconciler: enqueue jobs for active artists that predate the job tables; idempotent (insertIfAbsent)
  backfill-spread: ${BACKFILL_SPREAD:2h} # jitter window for backfilled next_due_at, so enabling the poller doesn't fire every job on the first tick

  # #177: bulk-import queue. Faster tick than the scan poller because this work is database-only
  # -- no external API to pace against -- so a large import drains in minutes rather than hours.
  import-poller-enabled: ${IMPORT_POLLER_ENABLED:true}
  import-tick-ms: ${IMPORT_TICK_MS:5000}
  import-batch-size: ${IMPORT_BATCH_SIZE:25}
  import-max-attempts: ${IMPORT_MAX_ATTEMPTS:3}

  # #174: keyset pagination page size for the /artists active list.
  artists-page-size: ${ARTISTS_PAGE_SIZE:20}

  auth:
    allowed-emails: ${ALLOWED_EMAILS:rob.sartin@gmail.com}
    seed-owner: ${SEED_OWNER:rob.sartin@gmail.com}
    admin-email: ${ADMIN_EMAIL:rob.sartin@gmail.com}
  apis:
    ticketmaster-api-key: ${TICKETMASTER_API_KEY:}
    bandsintown-app-id: ${BANDSINTOWN_APP_ID:}
    music-brainz-user-agent: ${MUSICBRAINZ_USER_AGENT:SetlistScout/0.1 ( rob.sartin@gmail.com )}
    discogs-token: ${DISCOGS_TOKEN:}
    last-fm-api-key: ${LASTFM_API_KEY:}
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  defaults:
    postal-code: ${DEFAULT_POSTAL_CODE:78701}
    city: ${DEFAULT_CITY:Austin}
    state: ${DEFAULT_STATE:TX}
    radius-miles: ${DEFAULT_RADIUS_MILES:50}
    months-ahead: ${DEFAULT_MONTHS_AHEAD:6}

management:
  endpoints:
    web:
      exposure:
        # metrics is NOT publicly readable: SecurityConfig's permitAll matches only the exact
        # literal "/actuator/health" (not a prefix like "/actuator/**"), so /actuator/metrics
        # falls through to anyRequest().authenticated() same as the rest of the app -- see #162
        # and ActuatorMetricsSecurityTest. This is what makes Hikari's hikaricp.connections.*
        # gauges (active/idle/pending/timeout/usage/acquire) readable for pool-sizing decisions.
        # prometheus is deliberately not added -- there's no scraper today, and metrics' plain
        # hand-inspectable JSON is enough (also avoids a new micrometer-registry-prometheus dep).
        include: health, metrics

logging:
  structured:
    format:
      console: ecs
  level:
    com.robsartin.setlistscout: ${LOG_LEVEL:INFO}

<!--/* #155: the current group's inner content (header + relation groups + rows), factored out of
       candidates.html so the two current-group <section> variants there (with/without a literal
       autofocus attribute -- see the comment above them) can th:insert the SAME markup instead of
       duplicating it. Non-parameterized on purpose: this fragment is only ever inserted from within
       candidatesApp's own context, so it shares that ambient context (current, rowsByType, outcome)
       the same way the rest of candidates.html does, rather than re-declaring every dependency at
       both call sites. Never rendered as its own page -- no controller returns this view name. */-->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="groupBody">
    <div class="artist-group-header" aria-live="polite">
        <h2 id="current-group-title" th:text="${current.via}">Base artist</h2>
        <span class="count" th:text="${current.total}">0</span>
    </div>

    <div class="relgroup" th:each="rg : ${current.relationGroups}">
        <div class="relgroup-header">
            <span class="chip" th:classappend="${rg.chipClass}" th:text="${rg.label}">Label</span>
            <span class="count" th:text="${rg.count}">0</span>
            <span class="group-actions">
                <form class="inline" th:hx-post="@{/artists/candidates/group}"
                      hx-target="#candidates-app" hx-swap="outerHTML" hx-disabled-elt="find button"
                      method="post" th:action="@{/artists/candidates/group}">
                    <input type="hidden" name="via" th:value="${current.via}"/>
                    <input type="hidden" name="type" th:value="${rg.source}"/>
                    <input type="hidden" name="decision" value="approve"/>
                    <button type="submit" class="btn-good btn-sm"
                            th:aria-label="'Approve all ' + ${rg.label} + ' from ' + ${current.via}">Approve all</button>
                </form>
                <form class="inline" th:hx-post="@{/artists/candidates/group}"
                      hx-target="#candidates-app" hx-swap="outerHTML" hx-disabled-elt="find button"
                      method="post" th:action="@{/artists/candidates/group}">
                    <input type="hidden" name="via" th:value="${current.via}"/>
                    <input type="hidden" name="type" th:value="${rg.source}"/>
                    <input type="hidden" name="decision" value="reject"/>
                    <button type="submit" class="btn-bad btn-sm"
                            th:aria-label="'Reject all ' + ${rg.label} + ' from ' + ${current.via}">Reject all</button>
                </form>
            </span>
        </div>
        <div class="cand-list">
            <div class="cand" th:each="a : ${rowsByType.get(rg.source)}">
                <span class="cand-name" th:text="${a.name}">Name</span>
                <span class="note" th:text="${a.note}">Note</span>
                <!--/* Important 2 (#148 fix round 3): these two per-row forms are the
                       original race -- two rapid clicks on different rows both target
                       #candidates-app, and without hx-sync (declared once, on
                       #candidates-app itself, in candidates.html) a slower response can re-render a
                       row the faster one already decided. hx-disabled-elt="find button" gives the
                       user feedback during the round trip (there was previously none:
                       htmx's default .htmx-request class has no CSS rule, and
                       .htmx-swapping only covers the swap animation itself).

                       Fix round 4: this was originally hx-disabled-elt="this", targeting
                       the <form> itself, which did nothing -- `disabled` is not a valid
                       attribute on <form> per the HTML spec (only button/input/select/
                       textarea/fieldset/optgroup/option support it), so browsers silently
                       ignored it. "find button" is htmx's extended-selector syntax
                       (confirmed against the vendored 2.0.3 build) for "the first button
                       descendant of the requesting element" -- the form's own submit
                       button, which does support `disabled`. Paired with the
                       button:disabled rule in app.css. */-->
                <!--/* #155: each action button below is duplicated as a th:if/th:unless pair rather
                       than toggled with a single th:autofocus/th:attr-set attribute. Thymeleaf's
                       standard dialect treats "autofocus" as a recognized HTML5 boolean attribute
                       and, whenever ANY th:* processor sets it (th:autofocus, or th:attr targeting
                       the literal name "autofocus") to any non-removed value, always serializes it
                       as autofocus="autofocus" -- confirmed empirically against this project's
                       Thymeleaf 3.1.5.RELEASE: th:attr with '', 'X', a plain string variable, and
                       'autofocus' itself all produced the identical autofocus="autofocus" output.
                       That breaks the "exactly one autofocus per response" contract every caller of
                       this fragment relies on: the literal substring "autofocus" would appear twice
                       (name AND value) for the one true occurrence. A literal, hand-written
                       autofocus attribute that Thymeleaf never touches renders bare -- confirmed
                       against the same version -- which is both what CandidateActionsTest's
                       countOccurrences asserts and the canonical HTML5 minimized boolean-attribute
                       form, so th:if/th:unless choosing between a bare-autofocus button and a plain
                       one is the correct fix, not a workaround. */-->
                <form class="inline" th:hx-post="@{/artists/{id}/approve(id=${a.id})}"
                      hx-target="#candidates-app" hx-swap="outerHTML" hx-disabled-elt="find button"
                      method="post" th:action="@{/artists/{id}/approve(id=${a.id})}">
                    <button th:if="${outcome != null and outcome.focusesRow(a.id, 'approve')}"
                            type="submit" class="btn-good btn-sm" autofocus
                            th:aria-label="'Approve ' + ${a.name}">Approve</button>
                    <button th:unless="${outcome != null and outcome.focusesRow(a.id, 'approve')}"
                            type="submit" class="btn-good btn-sm"
                            th:aria-label="'Approve ' + ${a.name}">Approve</button>
                </form>
                <form class="inline" th:hx-post="@{/artists/{id}/reject(id=${a.id})}"
                      hx-target="#candidates-app" hx-swap="outerHTML" hx-disabled-elt="find button"
                      method="post" th:action="@{/artists/{id}/reject(id=${a.id})}">
                    <button th:if="${outcome != null and outcome.focusesRow(a.id, 'reject')}"
                            type="submit" class="btn-bad btn-sm" autofocus
                            th:aria-label="'Reject ' + ${a.name}">Reject</button>
                    <button th:unless="${outcome != null and outcome.focusesRow(a.id, 'reject')}"
                            type="submit" class="btn-bad btn-sm"
                            th:aria-label="'Reject ' + ${a.name}">Reject</button>
                </form>
            </div>
        </div>
    </div>
</th:block>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, active, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Setlist Scout</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand"><span class="dot" aria-hidden="true"></span> Setlist Scout</span>
        <nav class="main" aria-label="Primary">
            <a th:href="@{/}" th:attr="aria-current=${active == 'shows'} ? 'page' : null">Shows</a>
            <a th:href="@{/artists}" th:attr="aria-current=${active == 'artists'} ? 'page' : null">Artists</a>
            <a th:href="@{/#settings}" th:attr="aria-current=${active == 'settings'} ? 'page' : null">Settings</a>
        </nav>
    </div>
</header>
<main class="wrap">
    <div th:replace="${content}">content</div>
</main>
</body>
</html>

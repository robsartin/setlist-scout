<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, navActive, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Setlist Scout</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<!--/* #155: the one live region for the whole app. It lives OUTSIDE <main>, and therefore outside
       every htmx swap target, on purpose: a region that is itself replaced by a swap is a brand-new
       region as far as a screen reader is concerned, and its arriving content is generally not
       announced. Actions update it out-of-band with hx-swap-oob="innerHTML" so this node persists
       and only its contents change. Ships empty on every page load. */-->
<p id="sr-status" role="status" aria-live="polite" class="visually-hidden"></p>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand"><span class="dot" aria-hidden="true"></span> Setlist Scout</span>
        <nav class="main" aria-label="Primary">
            <a th:href="@{/}" th:attr="aria-current=${navActive == 'shows'} ? 'page' : null">Shows</a>
            <a th:href="@{/shared}" th:attr="aria-current=${navActive == 'shared'} ? 'page' : null">Shared</a>
            <a th:href="@{/artists}" th:attr="aria-current=${navActive == 'artists'} ? 'page' : null">Artists</a>
            <!--/* #206 Task 6: no fragments/nav.html exists in this codebase -- the nav lives
                   here, inline in layout.html. Placed right after Artists: both are "things you
                   follow" that this owner configures, ahead of the review-workflow links
                   (Candidates/Rejected/Connections) that both artists and venues feed. */-->
            <a th:href="@{/venues}" th:attr="aria-current=${navActive == 'venues'} ? 'page' : null">Venues</a>
            <!--/* #236: Candidates/Rejected/Connections are the review queue -- workflow, not
                   destinations -- so they're demoted by WEIGHT (nav-review, styled in app.css)
                   rather than nested behind a disclosure: every link stays one click away, and
                   the eye still separates "what you follow" (above) from "review queue" (below).
                   No wrapper element around the group -- that would change how nav.main's own
                   flex-wrap reflows (one flex item per link, same as every link here); app.css's
                   sibling-combinator rule adds the visual gap/divider before Candidates instead.
                   Settings (formerly here, linking to @{/#settings}) is gone -- it was never a
                   page, just an anchor into the Shows page's own scope summary; id="settings"
                   still lives there (shows.html), unchanged. */-->
            <a th:href="@{/artists/candidates}" class="nav-review" th:attr="aria-current=${navActive == 'candidates'} ? 'page' : null">
                <!--/* id (issue #154): a stable out-of-band swap target. This span sits OUTSIDE
                       #candidates-app (the id below), so no htmx action on the Candidates page can
                       ever reach it via a normal swap -- see candidates.html's OOB companion span,
                       gated on ${oobNavBadge}, for the fix. */-->
                Candidates <span id="nav-candidates-badge" class="count" th:if="${pendingCount != null and pendingCount > 0}" th:text="${pendingCount}">0</span>
            </a>
            <a th:href="@{/artists/rejected}" class="nav-review" th:attr="aria-current=${navActive == 'rejected'} ? 'page' : null">Rejected</a>
            <a th:href="@{/artists/connections}" class="nav-review" th:attr="aria-current=${navActive == 'connections'} ? 'page' : null">Connections</a>
            <!--/* Admin-only (#201): the queues page's link. th:if is a UI convenience -- the page
                   itself re-checks AdminGuard#require() server-side, since a hidden link is not
                   access control. */-->
            <a th:if="${isAdmin}" th:href="@{/admin/queues}"
               th:attr="aria-current=${navActive == 'admin-queues'} ? 'page' : null">Admin</a>
        </nav>
    </div>
</header>
<main class="wrap">
    <div th:replace="${content}">content</div>
</main>
</body>
</html>

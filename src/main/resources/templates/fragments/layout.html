<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, navActive, content)">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">Setlist Scout</title>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <script th:src="@{/js/htmx.min.js}"></script>
</head>
<body>
<header class="topbar">
    <div class="topbar-inner">
        <span class="brand"><span class="dot" aria-hidden="true"></span> Setlist Scout</span>
        <nav class="main" aria-label="Primary">
            <a th:href="@{/}" th:attr="aria-current=${navActive == 'shows'} ? 'page' : null">Shows</a>
            <a th:href="@{/artists}" th:attr="aria-current=${navActive == 'artists'} ? 'page' : null">Artists</a>
            <a th:href="@{/artists/candidates}" th:attr="aria-current=${navActive == 'candidates'} ? 'page' : null">
                Candidates <span class="count" th:if="${pendingCount != null and pendingCount > 0}" th:text="${pendingCount}">0</span>
            </a>
            <a th:href="@{/artists/rejected}" th:attr="aria-current=${navActive == 'rejected'} ? 'page' : null">Rejected</a>
            <a th:href="@{/#settings}" th:attr="aria-current=${navActive == 'settings'} ? 'page' : null">Settings</a>
        </nav>
    </div>
</header>
<main class="wrap">
    <div th:replace="${content}">content</div>
</main>
</body>
</html>

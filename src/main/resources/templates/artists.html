<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Artists', 'artists', ~{::content})}">
<body>
<div th:fragment="content">
    <form class="inline" th:action="@{/artists/log-level}" method="post">
        <span class="note">Log level:</span>
        <button type="submit" name="level" value="INFO">INFO</button>
        <button type="submit" name="level" value="DEBUG">DEBUG</button>
    </form>

    <!--/* Issue #175: the add-artist form and the upload controls used to sit BELOW the active
           list, which can run to 1,500+ rows -- making the single most frequent action on this
           page (adding an artist) the hardest one to reach. Moved above the list instead.
           Moving a form above its own swap target is fine, and follows shows.html's settings/
           "Scan now" forms, which already sit above #shows-region the same way. */-->
    <form hx-boost="true" hx-target="#active-section" hx-swap="outerHTML" hx-push-url="false"
          hx-on::after-request="this.reset()"
          th:action="@{/artists/seed}" method="post">
        <label for="artist-name">Add a band to the seed list</label>
        <input type="text" id="artist-name" name="name" placeholder="Add a band to the seed list"/>
        <button type="submit">Add</button>
    </form>

    <!--/* uploadMessage and the import-progress display both describe the upload form directly
           below, so they travel with it (issue #175) rather than being stranded elsewhere on the
           page. */-->
    <p th:if="${uploadMessage}" th:text="${uploadMessage}" role="status" class="upload-message"></p>
    <!--/* #177: plain server-rendered import-progress text -- no JavaScript, no polling. Refreshes
           whenever populateActive next builds the model (a full page load, or any htmx action that
           swaps activeSection), same as everything else on this page. role="status" on the pending
           notice only, matching how uploadMessage above is announced; the failed-names list is
           visible text, not a live region -- it's a static list, not a one-line event to announce. */-->
    <p th:if="${importPendingCount > 0}"
       th:text="'Importing: ' + ${importPendingCount} + ' remaining.'"
       role="status" class="upload-message"></p>
    <div th:if="${not #lists.isEmpty(importFailed)}" class="upload-message">
        <p th:text="${#lists.size(importFailed)} + ' name' + (${#lists.size(importFailed)} == 1 ? '' : 's') + ' could not be imported.'">0 names could not be imported.</p>
        <ul>
            <li th:each="f : ${importFailed}" th:text="${f.name}">Name</li>
        </ul>
    </div>
    <form th:action="@{/artists/upload}" method="post" enctype="multipart/form-data">
        <label for="artist-file">Or bulk-add from a text file (one band per line):</label>
        <input type="file" id="artist-file" name="file" accept=".txt,text/plain"/>
        <button type="submit">Upload</button>
    </form>

    <h1>Active list (seed + approved)</h1>
    <!--/* activeSection is a swap target so a manual add can refresh it without a reload.
           Deliberately NO focus anchor here (no tabindex/autofocus), unlike shows.html's
           showsRegion or shared.html's shared-content: the add-artist form (issue #175) lives
           OUTSIDE this swap target, so an outerHTML swap here never touches the input or button
           the user was just using -- nothing is removed, so there's nothing to restore. Adding
           an autofocus anchor here would not fix a focus loss (there isn't one); it would CAUSE
           one, by pulling focus away from the input the user is about to type the next artist
           into. Don't re-add it -- see issue #175. */-->
    <div th:fragment="activeSection" id="active-section">
        <div class="table-scroll">
            <table>
                <thead><tr><th>Name</th><th>Source</th><th>Official site (scraped for tour dates)</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="a : ${active}">
                    <td>
                        <span th:text="${a.name}">Name</span>
                        <span th:if="${a.source.name() == 'TRIBUTE_EXPANSION'}" class="chip tribute">Tribute</span>
                        <a th:href="@{'/artists/' + ${a.id} + '/graph'}" class="note">graph</a>
                    </td>
                    <td th:text="${a.source}">Source</td>
                    <td>
                        <a th:if="${a.officialSiteUrl}" th:href="${a.officialSiteUrl}" th:text="${a.officialSiteUrl}"
                           target="_blank" rel="noopener noreferrer">site</a>
                        <form class="inline" hx-boost="true" hx-target="#active-section" hx-swap="outerHTML" hx-push-url="false"
                              th:action="@{'/artists/' + ${a.id} + '/site-url'}" method="post">
                            <input type="url" name="url" th:value="${a.officialSiteUrl}" placeholder="official site URL" size="22"/>
                            <button type="submit">Set</button>
                        </form>
                    </td>
                    <td>
                        <!--/* Remove = reject (APPROVED only): drops off the active list, stops scanning, reversible via Unreject.
                               Plain redirect since it updates both the active and rejected sections. */-->
                        <form class="inline remove" th:if="${a.status.name() == 'APPROVED'}"
                              th:action="@{'/artists/' + ${a.id} + '/remove'}" method="post">
                            <button type="submit" class="btn-bad" th:aria-label="'Remove ' + ${a.name}">Remove</button>
                        </form>
                        <!--/* Remove from seed (SEED only): drops off the active list, stops scanning, terminal (no unreject).
                               Plain redirect for consistency with Remove. */-->
                        <form class="inline remove" th:if="${a.status.name() == 'SEED'}"
                              th:action="@{'/artists/' + ${a.id} + '/remove-from-seed'}" method="post">
                            <button type="submit" class="btn-bad" th:aria-label="'Remove ' + ${a.name} + ' from seed list'">Remove from seed list</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

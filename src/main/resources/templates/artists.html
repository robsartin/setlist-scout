<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Artists', 'artists', ~{::content})}">
<body>
<div th:fragment="content">
    <form class="inline" th:action="@{/artists/log-level}" method="post">
        <span class="note">Log level:</span>
        <button type="submit" name="level" value="INFO">INFO</button>
        <button type="submit" name="level" value="DEBUG">DEBUG</button>
    </form>

    <h1>Active list (seed + approved)</h1>
    <!--/* activeSection is a swap target so a manual add can refresh it without a reload. */-->
    <div th:fragment="activeSection" id="active-section">
        <div class="table-scroll">
            <table>
                <thead><tr><th>Name</th><th>Source</th><th>Official site (scraped for tour dates)</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="a : ${active}">
                    <td>
                        <span th:text="${a.name}">Name</span>
                        <span th:if="${a.source.name() == 'TRIBUTE_EXPANSION'}" class="chip tribute">Tribute</span>
                    </td>
                    <td th:text="${a.source}">Source</td>
                    <td>
                        <a th:if="${a.officialSiteUrl}" th:href="${a.officialSiteUrl}" th:text="${a.officialSiteUrl}"
                           target="_blank" rel="noopener noreferrer">site</a>
                        <form class="inline" hx-boost="true" hx-target="#active-section" hx-swap="outerHTML" hx-push-url="false"
                              th:action="@{'/artists/' + ${a.id} + '/site-url'}" method="post">
                            <input type="url" name="url" th:value="${a.officialSiteUrl}" placeholder="official site URL" size="22"/>
                            <button type="submit">Set</button>
                        </form>
                    </td>
                    <td>
                        <!--/* Remove = reject: drops off the active list, stops scanning, reversible via Unreject.
                               Plain redirect since it updates both the active and rejected sections. */-->
                        <form class="inline remove" th:action="@{'/artists/' + ${a.id} + '/remove'}" method="post">
                            <button type="submit" class="btn-bad" th:aria-label="'Remove ' + ${a.name}">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <form hx-boost="true" hx-target="#active-section" hx-swap="outerHTML" hx-push-url="false"
          hx-on::after-request="this.reset()"
          th:action="@{/artists/seed}" method="post">
        <input type="text" name="name" placeholder="Add a band to the seed list"/>
        <button type="submit">Add</button>
    </form>

    <p th:if="${uploadMessage}" th:text="${uploadMessage}" role="status" class="upload-message"></p>
    <form th:action="@{/artists/upload}" method="post" enctype="multipart/form-data">
        <label for="artist-file">Or bulk-add from a text file (one band per line):</label>
        <input type="file" id="artist-file" name="file" accept=".txt,text/plain"/>
        <button type="submit">Upload</button>
    </form>
</div>
</body>
</html>

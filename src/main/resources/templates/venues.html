<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Venues', 'venues', ~{::content})}">
<body>
<!--/* #206 Task 6: the /venues management page -- mirrors artists.html's shape (add form above
       the list, real <label>s on both inputs) but not its htmx fragment-swap machinery. Neither
       action here needs a partial update: the add form already sits outside #venue-list, so a
       plain full-page POST-redirect-GET needs no autofocus/sr-status handling to stay accessible
       -- there is no swap to lose focus across. See VenueController's class javadoc. */-->
<div th:fragment="content">
    <!--/* #175 lesson, applied from the start this time: the add form goes ABOVE the list, not
           retrofitted later. */-->
    <form id="add-venue" th:action="@{/venues}" method="post">
        <h1>Add a venue</h1>
        <div>
            <label for="venue-name">Venue name</label>
            <input type="text" id="venue-name" name="name" placeholder="Venue name"/>
        </div>
        <div>
            <label for="venue-url">Calendar URL</label>
            <input type="url" id="venue-url" name="url" placeholder="https://venue.example.com/events"/>
        </div>
        <button type="submit">Add</button>
    </form>

    <h1>Followed venues</h1>
    <!--/* lastScanned/showCount are load-bearing, not decoration (#206 brief): a venue whose
           calendar silently stops parsing looks identical to a venue with no shows unless "never
           scanned" reads differently from "scanned and found nothing" -- the #211 failure mode.
           Kept as two distinct spans below rather than one combined string for exactly that
           reason. */-->
    <div id="venue-list" class="table-scroll">
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Calendar URL</th>
                <th>Last scanned</th>
                <th>Shows contributed</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${venues}">
                <td th:text="${row.venue.name}">Name</td>
                <td>
                    <a th:href="${row.venue.calendarUrl}" th:text="${row.venue.calendarUrl}"
                       target="_blank" rel="noopener noreferrer">calendar</a>
                </td>
                <td>
                    <span th:if="${row.lastScanned != null}"
                          th:text="${#temporals.format(row.lastScanned, 'MMM d, yyyy h:mm a')}">date</span>
                    <span th:unless="${row.lastScanned != null}" class="note">Never scanned yet</span>
                </td>
                <td th:text="${row.showCount} + ' show' + (${row.showCount} == 1 ? '' : 's')">0 shows</td>
            </tr>
            <tr th:if="${#lists.isEmpty(venues)}">
                <td colspan="4" class="note">No venues followed yet -- add one above.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

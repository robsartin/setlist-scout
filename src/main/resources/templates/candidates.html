<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Candidates', 'candidates', ~{::content})}">
<body>
<div th:fragment="content">
    <h1>Candidates</h1>
    <p class="page-sub">Discovered via expansion, grouped by the base artist that led us here. Expand a group to review its rows.</p>

    <!--/* globalBar is the htmx swap target for the bulk actions: approve-all/reject-all/expand-now
           all return just this (pendingCount comes from NavModelAdvice on every request). */-->
    <div th:fragment="globalBar" id="global-bar" class="globalbar card" aria-live="polite">
        <span class="count-label">
            <strong th:text="${pendingCount}">0</strong> pending
        </span>
        <form class="inline" th:if="${pendingCount != null and pendingCount > 0}"
              hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
              th:action="@{/artists/approve-all-pending}" method="post">
            <button type="submit" class="btn-good">Approve all remaining</button>
        </form>
        <form class="inline" th:if="${pendingCount != null and pendingCount > 0}"
              hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
              th:action="@{/artists/reject-all-pending}" method="post">
            <button type="submit" class="btn-bad btn-sm">Reject all remaining</button>
        </form>
        <form class="inline" hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
              th:action="@{/artists/expand-now}" method="post">
            <button type="submit">Run expansion now</button>
        </form>
        <!--/* Admin-only cross-account escape hatch (#136): visible only to the configured admin,
               and only when there's another allow-listed user to pick -- see NavModelAdvice. The
               server re-checks admin-ness itself (ReviewController#requireAdmin); this th:if is a
               UI convenience, not the access control. */-->
        <form class="inline" th:if="${isAdmin and not #lists.isEmpty(otherOwnerEmails)}"
              hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
              th:action="@{/artists/admin/expand-now}" method="post">
            <label for="admin-expand-target">Admin: expand for</label>
            <select id="admin-expand-target" name="targetOwner">
                <option th:each="email : ${otherOwnerEmails}" th:value="${email}" th:text="${email}">user@example.com</option>
            </select>
            <button type="submit">Run expansion for user</button>
        </form>
    </div>

    <p th:if="${#lists.isEmpty(groups)}">Nothing pending. Run expansion to find more.</p>

    <div class="artist-group card" th:each="g : ${groups}">
        <div class="artist-group-header">
            <h2 th:text="${g.via}">Base artist</h2>
            <span class="count" th:text="${g.total}">0</span>
        </div>

        <details class="relgroup" th:each="rg : ${g.relationGroups}">
            <summary>
                <span class="chip" th:classappend="${rg.chipClass}" th:text="${rg.label}">Label</span>
                <span class="count" th:text="${rg.count}">0</span>
                <span class="group-actions">
                    <!--/* Per-group bulk decision: htmx swaps just #global-bar (its pendingCount is
                           refreshed by NavModelAdvice on every request) so the running total stays
                           correct; this group's own summary count re-syncs on the next full page
                           load -- acceptable for v1 (see ReviewController#actionResult javadoc). */-->
                    <form class="inline" hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
                          th:action="@{/artists/candidates/group}" method="post">
                        <input type="hidden" name="via" th:value="${g.via}"/>
                        <input type="hidden" name="type" th:value="${rg.source}"/>
                        <input type="hidden" name="decision" value="approve"/>
                        <button type="submit" class="btn-good btn-sm"
                                th:aria-label="'Approve all ' + ${rg.label} + ' from ' + ${g.via}">Approve all</button>
                    </form>
                    <form class="inline" hx-boost="true" hx-target="#global-bar" hx-swap="outerHTML" hx-push-url="false"
                          th:action="@{/artists/candidates/group}" method="post">
                        <input type="hidden" name="via" th:value="${g.via}"/>
                        <input type="hidden" name="type" th:value="${rg.source}"/>
                        <input type="hidden" name="decision" value="reject"/>
                        <button type="submit" class="btn-bad btn-sm"
                                th:aria-label="'Reject all ' + ${rg.label} + ' from ' + ${g.via}">Reject all</button>
                    </form>
                </span>
            </summary>
            <!--/* Lazy load: the body only fetches this group's rows the first time the <details>
                   opens, so the initial page render carries counts only, not every candidate row.
                   "toggle once from:closest details" fires once, on the details element's own toggle
                   event -- verified against the vendored htmx build in CandidatesPageRenderTest (the
                   rows endpoint is independently GET-able either way). */-->
            <div class="body" aria-live="polite" aria-relevant="additions removals"
                 th:hx-get="@{/artists/candidates/rows(via=${g.via},type=${rg.source})}"
                 hx-trigger="toggle once from:closest details"
                 hx-target="this" hx-swap="innerHTML">
                <p class="lazy-hint">Loading&hellip;</p>
            </div>
        </details>
    </div>

    <!--/* rowDone: bare empty fragment returned by POST /artists/{id}/approve|reject on htmx requests.
           Its form targets closest .cand with hx-swap="outerHTML", so swapping this empty span in
           simply removes the row from view; the group's summary count and nav badge re-sync on the
           next full page load -- acceptable for v1 (see ReviewController#rowResult javadoc). */-->
    <span th:fragment="rowDone" class="cand-done" aria-hidden="true"></span>

    <!--/* groupRows: bare fragment returned by GET /artists/candidates/rows, both for a group's first
           lazy load (swapped into .body via innerHTML) and for "Show more" (swapped into the button
           itself via outerHTML, nesting a fresh .cand-list -- harmless for <div>s). */-->
    <div th:fragment="groupRows">
        <div class="cand-list">
            <div class="cand" th:each="a : ${rows}">
                <span class="cand-name" th:text="${a.name}">Name</span>
                <span class="note" th:text="${a.note}">Note</span>
                <form class="inline" th:action="@{/artists/{id}/approve(id=${a.id})}"
                      th:hx-post="@{/artists/{id}/approve(id=${a.id})}"
                      hx-target="closest .cand" hx-swap="outerHTML" method="post">
                    <button type="submit" class="btn-good btn-sm" th:aria-label="'Approve ' + ${a.name}">Approve</button>
                </form>
                <form class="inline" th:action="@{/artists/{id}/reject(id=${a.id})}"
                      th:hx-post="@{/artists/{id}/reject(id=${a.id})}"
                      hx-target="closest .cand" hx-swap="outerHTML" method="post">
                    <button type="submit" class="btn-bad btn-sm" th:aria-label="'Reject ' + ${a.name}">Reject</button>
                </form>
            </div>
            <p class="lazy-hint" th:if="${rows != null and #lists.isEmpty(rows)}">Nothing here.</p>
            <button th:if="${hasMore}" type="button" class="btn-sm show-more"
                    th:hx-get="@{/artists/candidates/rows(via=${via},type=${type},offset=${nextOffset})}"
                    hx-target="this" hx-swap="outerHTML">
                Show more
            </button>
        </div>
    </div>
</div>
</body>
</html>

setlistscout.scan-poller-enabled=false
setlistscout.expand-poller-enabled=false
# #206 Task 3: VenueScanRunnerTest (and any future test) creates venue_scan_job fixture rows
# directly -- off here for the same reason as the two flags above (PollerFlowTest's own comments
# document the race: a live poller ticking in the background can claim/run a test's own fixture
# row, or touch a @MockitoBean mid-stub in a LATER test class once Spring caches this context).
# Unlike import-poller-enabled (left on: nothing seeds artist_import outside its own dedicated
# tests), venue_scan_job fixtures are exactly what this task's own tests create, so this follows
# the scan/expand precedent instead.
setlistscout.venue-poller-enabled=false
# #203: the startup backfill (scan.ScanJobBackfill / expansion.ExpandJobBackfill) fires once,
# immediately, on the TaskScheduler shortly after every context boots (#195's @Scheduled fix) --
# asynchronously, off the thread any @Test method runs on. The admin-queue aggregates it can feed
# (countGroupedByStatus, countByNextDueAtLessThanEqual, findFirstByOrderByNextDueAtAsc) have no
# owner filter by design -- the admin page reports across every owner -- so a background insert
# from ANY source lands in their result and breaks an assertion like isEmpty() on a
# freshly-cleared table. Off here; ScanJobBackfillTest/ExpandJobBackfillTest/SharedScanGuardsTest
# re-enable it per-class via @TestPropertySource since they test the backfill itself.
setlistscout.job-backfill-enabled=false
# #184: point every external-adapter base URL at an unroutable local address so the test suite
# never makes a live HTTP call. Each adapter degrades to an empty result on any error (a
# refused connection included), so this is safe by construction -- see each service's Javadoc.
# A test that needs to assert on a specific result stubs the bean instead (e.g. SharedScanControllerTest
# @MockitoBean GeocodingService); everything else gets this adapter's documented empty fallback.
setlistscout.geocoding.base-url=http://127.0.0.1:1
setlistscout.musicbrainz.base-url=http://127.0.0.1:1
setlistscout.discogs.base-url=http://127.0.0.1:1
setlistscout.lastfm.base-url=http://127.0.0.1:1
setlistscout.tribute-llm.base-url=http://127.0.0.1:1
setlistscout.similar-artist-llm.base-url=http://127.0.0.1:1
setlistscout.tour-page-llm.base-url=http://127.0.0.1:1

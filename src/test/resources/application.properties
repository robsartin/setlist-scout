setlistscout.scan-poller-enabled=false
setlistscout.expand-poller-enabled=false
# #184: point every external-adapter base URL at an unroutable local address so the test suite
# never makes a live HTTP call. Each adapter degrades to an empty result on any error (a
# refused connection included), so this is safe by construction -- see each service's Javadoc.
# A test that needs to assert on a specific result stubs the bean instead (e.g. SharedScanControllerTest
# @MockitoBean GeocodingService); everything else gets this adapter's documented empty fallback.
setlistscout.geocoding.base-url=http://127.0.0.1:1
setlistscout.musicbrainz.base-url=http://127.0.0.1:1
setlistscout.discogs.base-url=http://127.0.0.1:1
setlistscout.lastfm.base-url=http://127.0.0.1:1
setlistscout.tribute-llm.base-url=http://127.0.0.1:1
setlistscout.similar-artist-llm.base-url=http://127.0.0.1:1
setlistscout.tour-page-llm.base-url=http://127.0.0.1:1

# Render Blueprint (Infrastructure as Code).
#
# Provision everything in one step: Render Dashboard -> New -> Blueprint -> connect
# this repo. Render reads this file, creates the web service AND the Postgres database,
# and wires the database connection automatically (DB_HOST/DB_PORT/DB_NAME/username/
# password come straight from the managed database -- no hand-formatted JDBC URL, so the
# "connection to localhost refused" footgun can't happen). You are prompted once for the
# secrets marked `sync: false`.
#
# ADOPTING THE EXISTING LIVE SERVICE (issue #85): Render matches Blueprint resources to
# existing ones by the `name` field below, NOT by `databaseName`/`user` (those two are
# write-once-at-creation and are ignored/irrelevant once a database already exists --
# see Render's Blueprint spec docs). Before running "New -> Blueprint" against the live
# service, confirm in the Render dashboard that:
#   - the existing web service's name is exactly `setlist-scout`
#   - the existing Postgres instance's name is exactly `setlist-scout-db`
# If either differs, rename the dashboard resource (or edit the `name:` below) BEFORE
# syncing -- a name that doesn't match causes Render to create a brand-new resource
# instead of adopting the existing one, which for the database would mean standing up an
# empty DB next to the real one. See docs/deploy/render-blueprint-migration.md for the
# full adoption walkthrough.
services:
  - type: web
    name: setlist-scout
    runtime: docker
    # Starter, not free (#41): the free tier suspends after ~15 min idle, which cost a measured
    # 92.5s cold start on every visit after a quiet spell, killed a 1,138-name bulk import
    # part-way by suspending mid-run, and left the paced pollers only running while someone
    # happened to be using the app. Measured after upgrading: 0.53s.
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass # matches the live service's "After CI Checks Pass" setting
    envVars:
      # Database connection -- wired automatically from the managed database below via
      # live `fromDatabase` references, so a future credential rotation propagates with
      # no manual re-link (the problem #85 exists to solve). Matches the split-var
      # fallback in application.yml (spring.datasource.url is composed from DB_HOST/
      # DB_PORT/DB_NAME when DATABASE_URL itself isn't set).
      - key: DB_HOST
        fromDatabase:
          name: setlist-scout-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: setlist-scout-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: setlist-scout-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: setlist-scout-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: setlist-scout-db
          property: password
      # Single-user (+ guest) gate. NOTE: the app reads ALLOWED_EMAILS (plural -- see
      # setlistscout.auth.allowed-emails in application.yml); an earlier version of this
      # file had the key wrong (ALLOWED_EMAIL, singular), which would have silently
      # no-op'd to the rob.sartin@gmail.com default instead of actually setting the list.
      # This is not a secret, so Blueprint sync will overwrite the live value with
      # whatever's here -- verify it matches the live env var before adopting.
      - key: ALLOWED_EMAILS
        value: rob.sartin@gmail.com,davidbuley01@gmail.com
      # Secrets -- Render prompts for these on first Blueprint apply (never committed).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: TICKETMASTER_API_KEY
        sync: false
      - key: BANDSINTOWN_APP_ID
        sync: false
      - key: DISCOGS_TOKEN
        sync: false
      - key: LASTFM_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: setlist-scout-db
    # Paid tier, matching the live instance (Render API reports basic_256mb). Declared here so a
    # Blueprint sync cannot silently downgrade a database that is being paid for.
    plan: basic-256mb
    region: oregon
    # databaseName/user below are ONLY applied if Render ends up CREATING a brand-new
    # database (no existing resource named `setlist-scout-db` found). For the live,
    # already-existing instance Render adopts by the `name:` field above and ignores
    # these two entirely (they're write-once-at-creation on Render's side, and the
    # username in particular rotates on every credential rotation -- committing today's
    # rotated value here would both leak it into a public repo and go stale on the very
    # next rotation, defeating the point of this issue). Left as generic defaults, not
    # the live values -- the runtime username/password always come from the live
    # `fromDatabase` refs above, never from this block.
    databaseName: setlistscout
    user: setlistscout

# Version catalog. Dependency versions themselves are managed by the Spring Boot
# BOM (via the io.spring.dependency-management plugin), so only the plugins are
# pinned here.
[versions]
spring-boot = "3.3.4"
dependency-management = "1.1.6"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependency-management" }

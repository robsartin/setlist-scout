# Lets Gradle discover a toolchain JDK from an env var, in addition to its normal detection
# (sdkman, jabba, IntelliJ, and its 5 hardcoded scan roots including /opt/java on Linux).
# This is what makes the Dockerfile build stage's JAVA_HOME_25_X64 env var actually work as
# JDK-25-toolchain discovery, rather than relying on the accidental coincidence that the
# borrowed JDK also happens to land under /opt/java (see Dockerfile and ADR-0016; #43).
# A no-op when the env var is unset -- Gradle just falls back to its normal detection, which
# is how local dev (sdkman) and CI (setup-gradle's generated toolchains.xml) still resolve
# the JDK 25 toolchain in build.gradle.kts without this property doing anything for them.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
